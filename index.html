    // ================= PRICE MODAL COMPONENT =================
    function PriceModal({ isOpen, onClose, products, onBatchUpdatePrices, onResetDefaults }) {
      const [tempPrices, setTempPrices] = useState({});
      const [notification, setNotification] = useState(null);

      useEffect(() => {
        if (products) {
          const init = {};
          products.forEach((p) => {
            init[p.id] = p.price.toString();
          });
          setTempPrices(init);
        }
      }, [products, isOpen]);

      if (!isOpen) return null;

      const handlePriceChange = (id, val) => {
        setTempPrices((prev) => ({ ...prev, [id]: val }));
      };

      const handleSaveAll = () => {
        const parsed = {};
        Object.entries(tempPrices).forEach(([id, val]) => {
          const clean = parseInt(val.toString().replace(/\D/g, ''), 10);
          if (!isNaN(clean) && clean > 0) {
            parsed[id] = clean;
          }
        });
        onBatchUpdatePrices(parsed);
        setNotification('Đã lưu thành công toàn bộ giá bán vào hệ thống!');
        setTimeout(() => {
          setNotification(null);
          onClose();
        }, 1200);
      };

      const handleReset = () => {
        if (confirm('Bạn có chắc muốn khôi phục bảng giá chuẩn ban đầu?')) {
          onResetDefaults();
          setNotification('Đã khôi phục giá mặc định thành công!');
          setTimeout(() => {
            setNotification(null);
            onClose();
          }, 1200);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#4A2E1B]/60 backdrop-blur-sm animate-fadeIn">
          <div className="bg-[#FFFCF7] border border-[#4A2E1B]/20 rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            <div className="flex items-center justify-between pb-4 border-b border-[#4A2E1B]/15">
              <div className="flex items-center space-x-3">
                <span className="p-2.5 bg-[#F7E6CA] rounded-2xl text-xl">⚙️</span>
                <div>
                  <h3 className="font-serif text-2xl font-bold text-[#4A2E1B]">
                    Bảng Quản Lý Giá Bán Động
                  </h3>
                  <p className="text-xs text-[#7A5230] font-sans">
                    Dành riêng cho Tổ 3 - 12A10 điều chỉnh nhanh giá sản phẩm
                  </p>
                </div>
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-[#F7E6CA]/60 hover:bg-[#F7E6CA] text-[#4A2E1B] flex items-center justify-center font-bold"
              >
                ✕
              </button>
            </div>

            {notification && (
              <div className="mt-4 p-3 bg-emerald-100 border border-emerald-300 text-emerald-800 rounded-xl text-xs font-semibold text-center animate-fadeIn">
                ✓ {notification}
              </div>
            )}

            <div className="mt-6 space-y-4 max-h-[60vh] overflow-y-auto pr-1">
              {products.map((p) => (
                <div
                  key={p.id}
                  className="p-4 rounded-2xl bg-[#F7E6CA]/30 border border-[#4A2E1B]/10 flex flex-col sm:flex-row sm:items-center justify-between gap-3"
                >
                  <div className="flex items-center space-x-3">
                    <img
                      src={p.image}
                      alt={p.name}
                      className="w-12 h-12 rounded-xl object-cover border border-[#4A2E1B]/15"
                    />
                    <div>
                      <h4 className="font-serif font-bold text-sm text-[#4A2E1B]">{p.name}</h4>
                      <p className="text-[11px] text-[#7A5230]">{p.volume} • {p.tag}</p>
                    </div>
                  </div>

                  <div className="flex items-center space-x-2">
                    <div className="relative w-32">
                      <input
                        type="text"
                        value={tempPrices[p.id] || ''}
                        onChange={(e) => handlePriceChange(p.id, e.target.value)}
                        className="w-full pl-3 pr-7 py-2 bg-white border border-[#4A2E1B]/20 rounded-xl text-sm font-bold text-[#4A2E1B] focus:outline-none focus:ring-2 focus:ring-[#7A5230]"
                        placeholder="79000"
                      />
                      <span className="absolute right-2.5 top-2.5 text-xs text-[#7A5230] font-bold">₫</span>
                    </div>
                  </div>
                </div>
              ))}
            </div>

            <div className="mt-6 pt-4 border-t border-[#4A2E1B]/15 flex items-center justify-between gap-3">
              <button
                onClick={handleReset}
                className="px-4 py-2.5 rounded-xl border border-red-300 text-red-700 hover:bg-red-50 text-xs font-semibold transition-colors"
              >
                ↺ Khôi phục gốc
              </button>

              <div className="flex items-center space-x-2">
                <button
                  onClick={onClose}
                  className="px-4 py-2.5 rounded-xl border border-[#4A2E1B]/20 text-[#4A2E1B] hover:bg-gray-100 text-xs font-medium"
                >
                  Đóng
                </button>
                <button
                  onClick={handleSaveAll}
                  className="px-5 py-2.5 rounded-xl bg-[#4A2E1B] hover:bg-[#321c0e] text-[#FFFCF7] text-xs font-bold shadow-md hover:shadow-lg transition-all"
                >
                  Lưu toàn bộ thay đổi
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ================= CART DRAWER COMPONENT =================
    function CartDrawer({
      isOpen,
      onClose,
      items,
      onUpdateQuantity,
      onRemoveItem,
      onClearCart,
      onOpenQR,
      onTriggerTestingNotice
    }) {
      const [promoCode, setPromoCode] = useState('');
      const [discountPercent, setDiscountPercent] = useState(0);
      const [promoMessage, setPromoMessage] = useState('');

      if (!isOpen) return null;

      const subtotal = items.reduce((sum, item) => sum + item.product.price * item.quantity, 0);
      const discountAmount = Math.round((subtotal * discountPercent) / 100);
      const shippingFee = subtotal > 200000 || subtotal === 0 ? 0 : 25000;
      const grandTotal = Math.max(0, subtotal - discountAmount + shippingFee);

      const handleApplyPromo = () => {
        if (promoCode.trim().toUpperCase() === 'VIECOCO10' || promoCode.trim().toUpperCase() === '12A10') {
          setDiscountPercent(10);
          setPromoMessage('Áp dụng thành công mã ưu đãi 10% từ 12A10!');
        } else {
          setPromoMessage('Mã không hợp lệ. Thử: 12A10 hoặc VIECOCO10');
        }
      };

      // KHI NHẤN VÀO MỤC THANH TOÁN -> HIỆN THÔNG BÁO THỬ NGHIỆM ĐÚNG THEO YÊU CẦU!
      const handleProceedCheckout = () => {
        onTriggerTestingNotice();
      };

      return (
        <div className="fixed inset-0 z-50 overflow-hidden bg-[#4A2E1B]/50 backdrop-blur-sm animate-fadeIn">
          <div className="fixed inset-y-0 right-0 max-w-full flex pl-10">
            <div className="w-screen max-w-md bg-[#FFFCF7] shadow-2xl flex flex-col justify-between border-l border-[#4A2E1B]/15">
              
              <div className="p-6 border-b border-[#4A2E1B]/15 flex items-center justify-between bg-[#F7E6CA]/40">
                <div className="flex items-center space-x-2">
                  <span className="text-xl">🛍️</span>
                  <div>
                    <h3 className="font-serif text-xl font-bold text-[#4A2E1B]">
                      Giỏ Hàng Của Bạn
                    </h3>
                    <p className="text-[11px] text-[#7A5230]">
                      {items.length} mặt hàng được chọn
                    </p>
                  </div>
                </div>
                <button
                  onClick={onClose}
                  className="w-8 h-8 rounded-full bg-[#FFFCF7] text-[#4A2E1B] hover:bg-[#4A2E1B] hover:text-[#FFFCF7] flex items-center justify-center font-bold text-sm transition-colors border border-[#4A2E1B]/20"
                >
                  ✕
                </button>
              </div>

              <div className="flex-1 overflow-y-auto p-6 space-y-6">
                {items.length === 0 ? (
                  <div className="text-center py-16 space-y-3">
                    <span className="text-4xl block">🥥</span>
                    <p className="font-serif text-lg font-bold text-[#4A2E1B]">
                      Giỏ hàng của bạn đang trống
                    </p>
                    <p className="text-xs text-[#7A5230]">
                      Hãy chọn những sản phẩm dừa thiên nhiên cao cấp để nâng niu làn da nhé!
                    </p>
                    <button
                      onClick={onClose}
                      className="mt-4 px-6 py-2.5 bg-[#4A2E1B] text-[#FFFCF7] rounded-full text-xs font-semibold"
                    >
                      Khám phá sản phẩm
                    </button>
                  </div>
                ) : (
                  <div className="space-y-4">
                    {items.map((item) => (
                      <div
                        key={item.product.id}
                        className="p-3 rounded-2xl bg-[#F7E6CA]/30 border border-[#4A2E1B]/15 flex items-center space-x-3"
                      >
                        <img
                          src={item.product.image}
                          alt={item.product.name}
                          className="w-16 h-16 rounded-xl object-cover border border-[#4A2E1B]/10"
                        />
                        <div className="flex-1 min-w-0">
                          <h4 className="font-serif font-bold text-sm text-[#4A2E1B] truncate">
                            {item.product.name}
                          </h4>
                          <p className="text-xs text-[#7A5230] font-bold">
                            {formatCurrency(item.product.price)}
                          </p>
                          
                          <div className="flex items-center space-x-2 mt-2">
                            <div className="flex items-center border border-[#4A2E1B]/20 rounded-lg bg-white overflow-hidden">
                              <button
                                onClick={() => onUpdateQuantity(item.product.id, item.quantity - 1)}
                                className="w-6 h-6 flex items-center justify-center text-xs font-bold text-[#4A2E1B] hover:bg-gray-100"
                              >
                                -
                              </button>
                              <span className="w-8 text-center text-xs font-bold">
                                {item.quantity}

                              <button
                                onClick={() => onUpdateQuantity(item.product.id, item.quantity + 1)}

                  </div>
                )}
              </div>

              {items.length > 0 && (
                <div className="p-6 border-t border-[#4A2E1B]/15 bg-[#F7E6CA]/30 space-y-3">
                  <div className="space-y-1.5 text-xs">
                    <div className="flex justify-between text-[#4A2E1B]/80">
                      <span>Tạm tính:</span>
                      <span>{formatCurrency(subtotal)}</span>
                    </div>
                    {discountAmount > 0 && (
                      <div className="flex justify-between text-emerald-700 font-medium">
                        <span>Ưu đãi (10%):</span>
                        <span>-{formatCurrency(discountAmount)}</span>
                      </div>
                    )}
                    <div className="flex justify-between text-[#4A2E1B]/80">
                      <span>Phí vận chuyển:</span>
                      <span>{shippingFee === 0 ? 'Miễn phí' : formatCurrency(shippingFee)}</span>
                    </div>
                    <div className="pt-2 border-t border-[#4A2E1B]/15 flex justify-between font-serif text-base font-bold text-[#4A2E1B]">
                      <span>Tổng thanh toán:</span>
                      <span>{formatCurrency(grandTotal)}</span>
                    </div>
                  </div>

                  {/* Nút bấm thanh toán kích hoạt thông báo thử nghiệm! */}
                  <button
                    onClick={handleProceedCheckout}
                    className="w-full py-3.5 bg-[#4A2E1B] hover:bg-[#321c0e] text-[#FFFCF7] rounded-xl font-sans font-bold text-xs uppercase tracking-wider shadow-lg hover:shadow-xl transition-all flex items-center justify-center space-x-2 shimmer-btn"
                  >
                    <span>Tiến hành thanh toán</span>
                    <span>→</span>
                  </button>
                </div>
              )}

            </div>
          </div>
        </div>
      );
    }

    // ================= ROOT MAIN APP COMPONENT =================
    function MainApp() {
      // Products state persisted in localStorage
      const [products, setProducts] = useState(() => {
        try {
          const saved = localStorage.getItem('viecoco_products_v2');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return INITIAL_PRODUCTS;
      });

      // Cart state persisted in localStorage
      const [cart, setCart] = useState(() => {
        try {
          const savedCart = localStorage.getItem('viecoco_cart_v2');
          if (savedCart) return JSON.parse(savedCart);
        } catch (e) {}
        return [];
      });

      // Admin user state persisted in localStorage
      const [adminUser, setAdminUser] = useState(() => {
        try {
          return localStorage.getItem('viecoco_admin_email') || null;
        } catch (e) {
          return null;
        }
      });

      const [activeSection, setActiveSection] = useState('hero');
      const [isEditPriceMode, setIsEditPriceMode] = useState(false);
      const [isPriceModalOpen, setIsPriceModalOpen] = useState(false);
      const [isQRModalOpen, setIsQRModalOpen] = useState(false);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isAdminAuthOpen, setIsAdminAuthOpen] = useState(false);
      const [isProductManageOpen, setIsProductManageOpen] = useState(false);
      const [productToEdit, setProductToEdit] = useState(null);
      const [showTestingNotice, setShowTestingNotice] = useState(false);
      const [quickViewProduct, setQuickViewProduct] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);

      // Save products to state and LocalStorage
      const saveProductsToStorage = (updatedList) => {
        setProducts(updatedList);
        try {
          localStorage.setItem('viecoco_products_v2', JSON.stringify(updatedList));
        } catch (e) {}
      };

      useEffect(() => {
        try {
          localStorage.setItem('viecoco_cart_v2', JSON.stringify(cart));
        } catch (e) {}
      }, [cart]);

      // Admin Login
      const handleAdminLoginSuccess = (email) => {
        setAdminUser(email);
        try {
          localStorage.setItem('viecoco_admin_email', email);
        } catch (e) {}
        setToastMessage(`👑 Đã đăng nhập quản trị thành công: ${email}`);
      };

      // Admin Logout
      const handleAdminLogout = () => {
        setAdminUser(null);
        try {
          localStorage.removeItem('viecoco_admin_email');
        } catch (e) {}
        setToastMessage('Đã đăng xuất khỏi tài khoản Admin');
      };

      // Add or Edit Product (CMS)
      const handleSaveProduct = (productData) => {
        const exists = products.some((p) => p.id === productData.id);
        let updatedList;
        if (exists) {
          updatedList = products.map((p) => (p.id === productData.id ? productData : p));
          setToastMessage(`Đã cập nhật sản phẩm "${productData.name}"`);
        } else {
          updatedList = [productData, ...products];
          setToastMessage(`✨ Đã thêm mẫu sản phẩm mới "${productData.name}"`);
        }
        saveProductsToStorage(updatedList);
      };

      // Delete Product (CMS)
      const handleDeleteProduct = (productId) => {
        const prod = products.find((p) => p.id === productId);
        if (confirm(`Bạn có chắc chắn muốn xóa sản phẩm "${prod ? prod.name : ''}" khỏi website?`)) {
          const updatedList = products.filter((p) => p.id !== productId);
          saveProductsToStorage(updatedList);
          // Remove from cart if present
          setCart((prev) => prev.filter((item) => item.product.id !== productId));
          setToastMessage(`Đã xóa sản phẩm thành công.`);
        }
      };

      // Inline update single price
      const handleUpdatePrice = (productId, newPrice) => {
        const updated = products.map((p) => (p.id === productId ? { ...p, price: newPrice } : p));
        saveProductsToStorage(updated);

        setCart((prevCart) =>
          prevCart.map((item) =>
            item.product.id === productId
              ? { ...item, product: { ...item.product, price: newPrice } }
              : item
          )
        );

        setToastMessage(`Đã cập nhật giá mới: ${formatCurrency(newPrice)}`);
      };

      // Batch update prices
      const handleBatchUpdatePrices = (updatedPrices) => {
        const updated = products.map((p) => {
          if (updatedPrices[p.id] !== undefined) {
            return { ...p, price: updatedPrices[p.id] };
          }
          return p;
        });
        saveProductsToStorage(updated);

        setCart((prevCart) =>
          prevCart.map((item) =>
            updatedPrices[item.product.id] !== undefined
              ? { ...item, product: { ...item.product, price: updatedPrices[item.product.id] } }
              : item
          )
        );

        setToastMessage('Đã lưu thành công tất cả giá mới vào hệ thống!');
      };

      // Reset defaults
      const handleResetDefaults = () => {
        saveProductsToStorage(INITIAL_PRODUCTS);
        setCart([]);
        setToastMessage('Đã khôi phục 3 sản phẩm mẫu chuẩn ban đầu!');
      };

      // Cart operations
      const handleAddToCart = (product) => {
        setCart((prevCart) => {
          const existing = prevCart.find((item) => item.product.id === product.id);
          if (existing) {
            return prevCart.map((item) =>
              item.product.id === product.id ? { ...item, quantity: item.quantity + 1 } : item
            );
          }
          return [...prevCart, { product, quantity: 1 }];
        });
        setToastMessage(`Đã thêm "${product.name}" vào giỏ hàng`);
      };

      const handleUpdateQuantity = (productId, quantity) => {
        if (quantity <= 0) {
          handleRemoveItem(productId);
          return;
        }
        setCart((prevCart) =>
          prevCart.map((item) => (item.product.id === productId ? { ...item, quantity } : item))
        );
      };

      const handleRemoveItem = (productId) => {
        setCart((prevCart) => prevCart.filter((item) => item.product.id !== productId));
        setToastMessage('Đã bỏ sản phẩm khỏi giỏ');
      };

      const handleClearCart = () => setCart([]);

      // Trigger Testing Notice when clicking checkout
      const handleTriggerTestingNotice = () => {
        setIsCartOpen(false);
        setShowTestingNotice(true);
      };

      // Smooth scroll navigation
      const handleNavigate = (sectionId) => {
        setActiveSection(sectionId);
        const element = document.getElementById(sectionId);
        if (element) {
          element.scrollIntoView({ behavior: 'smooth' });
        }
      };

      useEffect(() => {
        const sections = ['hero', 'about', 'products', 'contact'];
        const handleScroll = () => {
          const scrollPos = window.scrollY + 200;
          for (const sectionId of sections) {
            const el = document.getElementById(sectionId);
            if (el) {
              const top = el.offsetTop;
              const height = el.offsetHeight;
              if (scrollPos >= top && scrollPos < top + height) {
                setActiveSection(sectionId);
                break;
              }
            }
          }
        };

        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const totalCartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

      return (
        <div className="min-h-screen bg-[#F7E6CA] text-[#4A2E1B] font-sans antialiased selection:bg-[#7A5230] selection:text-[#FFFCF7]">
          
          {/* Top Admin Notice Bar if logged in */}
          {adminUser && (
            <div className="bg-[#4A2E1B] text-[#F7E6CA] px-4 py-2 text-xs flex items-center justify-between sticky top-0 z-50 border-b border-[#F7E6CA]/30">
              <div className="flex items-center space-x-2">
                <span className="text-base">👑</span>
                <span>Chế độ Quản Trị Viên: <strong>{adminUser}</strong></span>
              </div>
              <div className="flex items-center space-x-3">
                <button
                  onClick={() => {
                    setProductToEdit(null);
                    setIsProductManageOpen(true);
                  }}
                  className="px-2.5 py-1 bg-[#F7E6CA] text-[#4A2E1B] font-bold rounded-lg hover:bg-white transition-colors"
                >
                  + Đăng mẫu sản phẩm mới
                </button>
                <button
                  onClick={handleAdminLogout}
                  className="text-xs text-red-300 hover:text-white underline"
                >
                  Đăng xuất
                </button>
              </div>
            </div>
          )}

          {/* Left Sidebar on Desktop */}
          <Sidebar
            activeSection={activeSection}
            onNavigate={handleNavigate}
            cartCount={totalCartCount}
            onOpenCart={() => setIsCartOpen(true)}
            onOpenQR={() => setIsQRModalOpen(true)}
            isEditPriceMode={isEditPriceMode}
            onToggleEditPriceMode={() => {
              const next = !isEditPriceMode;
              setIsEditPriceMode(next);
              setToastMessage(
                next
                  ? '⚙️ Đã bật Chế độ chỉnh sửa giá bán. Nhấp vào giá từng sản phẩm để sửa!'
                  : 'Đã tắt chế độ sửa giá. Chuyển sang giao diện bán lẻ.'
              );
            }}
            adminUser={adminUser}
            onOpenAdminAuth={() => setIsAdminAuthOpen(true)}
            onLogoutAdmin={handleAdminLogout}
            onOpenAddProduct={() => {
              setProductToEdit(null);
              setIsProductManageOpen(true);
            }}
          />

          <main className="lg:pl-72 transition-all duration-300">
            <Hero
              onExploreClick={() => handleNavigate('products')}
              onOpenQR={() => setIsQRModalOpen(true)}
            />

            <About />

            {/* PRODUCT SHOWCASE SECTION WITH CMS CONTROLS */}
            <section id="products" className="py-20 lg:py-28 relative bg-[#FFFCF7]/40 border-y border-[#4A2E1B]/10">
              <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                
                <div className="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-6">
                  <div>
                    <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-[#FFFCF7] border border-[#4A2E1B]/15 mb-3">
                      <span className="w-2 h-2 rounded-full bg-[#8C9A7B]"></span>
                      <span className="text-[11px] uppercase tracking-widest text-[#7A5230] font-sans font-semibold">
                        Danh mục sản phẩm cốt lõi
                      </span>
                    </div>
                    <h2 className="font-serif text-3xl sm:text-4xl lg:text-5xl font-bold text-[#4A2E1B]">
                      Bộ Sưu Tập Dừa Thủ Công
                    </h2>
                    <p className="font-sans text-xs sm:text-sm text-[#4A2E1B]/75 mt-2 max-w-xl">
                      Chắt lọc từ tinh chất dừa sáp Bến Tre, dịu nhẹ nâng niu làn môi và làn da với các dưỡng chất tự nhiên thuần khiết nhất.
                    </p>
                  </div>

                  <div className="flex flex-wrap items-center gap-3">
                    {/* Add Product Button for Admin */}
                    {adminUser && (
                      <button
                        onClick={() => {
                          setProductToEdit(null);
                          setIsProductManageOpen(true);
                        }}
                        className="px-4 py-2.5 rounded-2xl bg-[#4A2E1B] text-[#FFFCF7] text-xs font-bold shadow-md hover:bg-black transition-all flex items-center space-x-1.5"
                      >
                        <span>✨</span>
                        <span>Đăng mẫu sản phẩm mới</span>
                      </button>
                    )}

                    <button
                      onClick={() => {
                        const next = !isEditPriceMode;
                        setIsEditPriceMode(next);
                        setToastMessage(
                          next
                            ? '⚙️ Đã bật Chế độ chỉnh sửa giá bán'
                            : 'Đã tắt chế độ sửa giá'
                        );
                      }}
                      className={`px-4 py-2.5 rounded-2xl text-xs font-semibold flex items-center space-x-2 transition-all shadow-sm ${
                        isEditPriceMode
                          ? 'bg-[#7A5230] text-[#FFFCF7] ring-2 ring-[#7A5230]/40'
                          : 'bg-[#FFFCF7] text-[#4A2E1B] border border-[#4A2E1B]/20 hover:border-[#4A2E1B]'
                      }`}
                      title="Bật/Tắt chế độ nhấp vào giá để sửa nhanh"
                    >
                      <span>⚙️ Chế độ chỉnh sửa giá:</span>
                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                        isEditPriceMode ? 'bg-[#FFFCF7] text-[#4A2E1B]' : 'bg-[#4A2E1B]/10 text-[#4A2E1B]'
                      }`}>
                        {isEditPriceMode ? 'BẬT' : 'TẮT'}
                      </span>
                    </button>

                    <button
                      onClick={() => setIsPriceModalOpen(true)}
                      className="px-4 py-2.5 rounded-2xl bg-[#FFFCF7] text-[#4A2E1B] border border-[#4A2E1B]/20 hover:bg-[#F7E6CA] text-xs font-semibold transition-all shadow-sm flex items-center space-x-1.5"
                      title="Mở bảng tổng hợp sửa tất cả giá cùng lúc"
                    >
                      <span>📋 Bảng quản lý giá</span>
                    </button>
                  </div>
                </div>

                {/* Products Grid */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                  {products.map((product) => (
                    <ProductCard
                      key={product.id}
                      product={product}
                      isEditPriceMode={isEditPriceMode}
                      onUpdatePrice={handleUpdatePrice}
                      onAddToCart={handleAddToCart}
                      onQuickView={(p) => setQuickViewProduct(p)}
                      isAdmin={!!adminUser}
                      onEditProduct={(p) => {
                        setProductToEdit(p);
                        setIsProductManageOpen(true);
                      }}
                      onDeleteProduct={handleDeleteProduct}
                    />
                  ))}
                </div>

                {/* TESTIMONIALS */}
                <div className="mt-20 pt-16 border-t border-[#4A2E1B]/15">
                  <div className="text-center mb-10">
                    <span className="text-[11px] uppercase tracking-widest text-[#7A5230] font-sans font-semibold">
                      Cảm nhận chân thực
                    </span>
                    <h3 className="font-serif text-2xl sm:text-3xl font-bold text-[#4A2E1B] mt-1">
                      Được Yêu Thích Bởi Lứa Tuổi Học Đường & Giới Trẻ
                    </h3>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="p-6 rounded-2xl bg-[#FFFCF7] border border-[#4A2E1B]/15 shadow-sm space-y-3">
                      <div className="text-amber-500 text-xs">★★★★★</div>
                      <p className="text-xs text-[#4A2E1B]/80 italic leading-relaxed font-sans">
                        "Son dưỡng dừa mùi thơm nhẹ tênh như kẹo dừa non, thoa buổi tối ngủ dậy môi căng mọng cực thích. Đi học thoa không hề bị bóng nhẫy hay bết dính!"
                      </p>
                      <div className="pt-2 border-t border-[#4A2E1B]/10 flex items-center space-x-2">
                        <div className="w-7 h-7 rounded-full bg-[#F7E6CA] flex items-center justify-center text-xs font-bold text-[#4A2E1B]">
                          M
                        </div>
                        <div>
                          <p className="text-xs font-bold text-[#4A2E1B]">Minh Anh</p>
                          <p className="text-[10px] text-[#7A5230]">Học sinh 12A10</p>
                        </div>
                      </div>
                    </div>

                    <div className="p-6 rounded-2xl bg-[#FFFCF7] border border-[#4A2E1B]/15 shadow-sm space-y-3">
                      <div className="text-amber-500 text-xs">★★★★★</div>
                      <p className="text-xs text-[#4A2E1B]/80 italic leading-relaxed font-sans">
                        "Hũ scrub môi đường mía dừa dùng xong thoa son lên màu siêu mướt. Bao bì hũ thủy tinh cầm rất chắc tay và sang trọng, không nghĩ là sản phẩm thủ công của các bạn học sinh làm!"
                      </p>
                      <div className="pt-2 border-t border-[#4A2E1B]/10 flex items-center space-x-2">
                        <div className="w-7 h-7 rounded-full bg-[#F7E6CA] flex items-center justify-center text-xs font-bold text-[#4A2E1B]">
                          K
                        </div>
                        <div>
                          <p className="text-xs font-bold text-[#4A2E1B]">Khánh Linh</p>
                          <p className="text-[10px] text-[#7A5230]">Thành viên CLB Khởi Nghiệp</p>
                        </div>
                      </div>
                    </div>

                    <div className="p-6 rounded-2xl bg-[#FFFCF7] border border-[#4A2E1B]/15 shadow-sm space-y-3">
                      <div className="text-amber-500 text-xs">★★★★★</div>
                      <p className="text-xs text-[#4A2E1B]/80 italic leading-relaxed font-sans">
                        "Tẩy da chết body cà phê dừa thơm nức mũi mùi Robusta rang mộc. Tắm xong da mịn như lụa, đỡ hẳn sần sùi vùng bắp tay. Rất tự hào về dự án của Tổ 3!"
                      </p>
                      <div className="pt-2 border-t border-[#4A2E1B]/10 flex items-center space-x-2">
                        <div className="w-7 h-7 rounded-full bg-[#F7E6CA] flex items-center justify-center text-xs font-bold text-[#4A2E1B]">
                          H
                        </div>
                        <div>
                          <p className="text-xs font-bold text-[#4A2E1B]">Hoàng Nam</p>
                          <p className="text-[10px] text-[#7A5230]">Bí thư Chi đoàn</p>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

              </div>
            </section>

            <Contact />

            <Footer
              onOpenQR={() => setIsQRModalOpen(true)}
              onNavigate={handleNavigate}
            />
          </main>

          {/* Floating Mobile QR Trigger */}
          <div className="fixed bottom-6 left-6 z-30 lg:hidden">
            <button
              onClick={() => setIsQRModalOpen(true)}
              className="p-3 bg-[#4A2E1B] text-[#FFFCF7] rounded-full shadow-2xl flex items-center justify-center border border-[#F7E6CA]/30 active:scale-95 transition-transform"
              title="Mở mã QR"
            >
              📱
            </button>
          </div>

          {/* ALL MODALS */}
          <AdminAuthModal
            isOpen={isAdminAuthOpen}
            onClose={() => setIsAdminAuthOpen(false)}
            onLoginSuccess={handleAdminLoginSuccess}
          />

          <ProductManageModal
            isOpen={isProductManageOpen}
            onClose={() => {
              setIsProductManageOpen(false);
              setProductToEdit(null);
            }}
            productToEdit={productToEdit}
            onSaveProduct={handleSaveProduct}
          />

          <TestingNoticeModal
            isOpen={showTestingNotice}
            onClose={() => setShowTestingNotice(false)}
          />

          <PriceModal
            isOpen={isPriceModalOpen}
            onClose={() => setIsPriceModalOpen(false)}
            products={products}
            onBatchUpdatePrices={handleBatchUpdatePrices}
            onResetDefaults={handleResetDefaults}
          />

          <QRModal
            isOpen={isQRModalOpen}
            onClose={() => setIsQRModalOpen(false)}
          />

          <CartDrawer
            isOpen={isCartOpen}
            onClose={() => setIsCartOpen(false)}
            items={cart}
            onUpdateQuantity={handleUpdateQuantity}
            onRemoveItem={handleRemoveItem}
            onClearCart={handleClearCart}
            onOpenQR={() => {
              setIsCartOpen(false);
              setIsQRModalOpen(true);
            }}
            onTriggerTestingNotice={handleTriggerTestingNotice}
          />

          <QuickViewModal
            product={quickViewProduct}
            onClose={() => setQuickViewProduct(null)}
            onAddToCart={handleAddToCart}
          />

          <Toast
            message={toastMessage}
            onClose={() => setToastMessage(null)}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);
  </script>
</body>
</html>
